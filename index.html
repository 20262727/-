<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>最下位の札 ― デスカードゲーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--panel:#141416;--line:#2a2a2e;--red:#d0142c;--red2:#ff3b52;--txt:#e9e6e1;--dim:#8a8790;--gold:#e6c46a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:"Noto Sans JP",sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:49;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.75) 100%)}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 26px}
header{text-align:center}
h1{font-family:"Dela Gothic One";font-weight:400;margin:0;font-size:28px;letter-spacing:.12em;text-shadow:0 0 18px rgba(208,20,44,.55)}
h1 span{color:var(--red2)}
.sub{font-size:11px;letter-spacing:.35em;color:var(--dim)}
.info{display:flex;justify-content:space-between;align-items:center;margin:10px 2px 8px;font-size:12px;color:var(--dim)}
.info b{color:var(--txt)}
.event{background:#1a0a0d;border:1px solid #4a1218;border-radius:8px;padding:7px 10px;font-size:12px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.event .en{font-family:"Dela Gothic One";color:var(--red2);font-size:14px;white-space:nowrap}
.event.calm{background:#141416;border-color:var(--line)}.event.calm .en{color:var(--dim)}
/* table */
.table{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:radial-gradient(ellipse at center,#1d0e10,#0c0809);
 border:1px solid #3a1418;border-radius:14px;padding:10px 6px}
.seat{text-align:center;position:relative;padding:4px 0;border-radius:8px;transition:.25s}
.seat.dead{filter:grayscale(1);opacity:.4}
.seat .nm{font-size:12px;font-weight:900;display:flex;justify-content:center;align-items:center;gap:4px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.gauge{height:8px;margin:4px 6px 1px;background:#1e1e22;border:1px solid #333;border-radius:4px;overflow:hidden}
.gauge .fill{height:100%;transition:width .6s cubic-bezier(.2,.8,.2,1),background .6s;box-shadow:0 0 8px currentColor}
.seat .hpn{font-size:11px;font-weight:900;font-variant-numeric:tabular-nums}
.seat .hc{font-size:10px;color:var(--dim);margin-bottom:4px}
.slot{width:58px;height:82px;margin:0 auto;border-radius:7px;border:1px dashed #3a2a2d;display:flex;align-items:center;justify-content:center}
.res{height:20px;font-size:12px;font-weight:900;margin-top:4px}
.res.bad{color:var(--red2)}.res.good{color:#79e08a}
.seat.lose .slot .card{box-shadow:0 0 0 2px var(--red2),0 0 16px rgba(255,59,82,.7)}
.seat .x{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-family:"Dela Gothic One";color:var(--red);font-size:16px;transform:rotate(-14deg)}
.seat.dead .x{display:flex}
/* cards */
.card{width:58px;height:82px;border-radius:7px;background:linear-gradient(160deg,#f3eee6,#d9d1c4);color:#1a1a1a;position:relative;
 display:flex;align-items:center;justify-content:center;font-family:"Dela Gothic One";font-size:28px;box-shadow:0 3px 6px rgba(0,0,0,.6);flex:none}
.card .c{position:absolute;top:3px;left:5px;font-size:11px}
.card .c2{position:absolute;bottom:3px;right:5px;font-size:11px;transform:rotate(180deg)}
.card.low{color:#b0102a}
.card.sp{background:linear-gradient(160deg,#25141a,#0e0809);color:var(--gold);border:1px solid #6a4a20;flex-direction:column;font-size:26px}
.card.sp .sn{font-family:"Noto Sans JP";font-size:10px;font-weight:900;margin-top:2px;letter-spacing:.1em}
.card.reaper{color:#ff4d5e;border-color:#7a1b27}
.card.charm{color:#79e08a;border-color:#2a6a35}
.card.rev{color:#7fb7ff;border-color:#2a4a7a}
.card.vamp{color:#d04aff;border-color:#5a1f7a}.card.mimic{color:#e6c46a;border-color:#7a6a2a}
.card.bomb{color:#ff9a3c;border-color:#7a3f12}.card.seal{color:#c8c8c8;border-color:#555}.card.scale{color:#5fd8d0;border-color:#1f5a56}
.card.back{background:repeating-linear-gradient(45deg,#3a0d14 0 6px,#25070c 6px 12px);border:2px solid #6d1520}
.card.back::after{content:"✠";color:#a33;font-size:22px}
.card.flip{animation:flip .35s ease-out}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:none}}
/* hand */
.hand-t{font-size:12px;color:var(--dim);margin:14px 2px 6px;display:flex;justify-content:space-between}
.hand{display:flex;gap:8px;justify-content:center;min-height:100px;padding:6px 0}
.hand .card{width:68px;height:96px;font-size:32px;cursor:pointer;transition:.15s}
.hand .card .c,.hand .card .c2{font-size:12px}
.hand .card.sel{transform:translateY(-12px);box-shadow:0 0 0 2px var(--red2),0 8px 18px rgba(255,59,82,.45)}
.hand.locked .card{opacity:.55;pointer-events:none}
.btn{font-family:"Noto Sans JP";font-weight:900;font-size:15px;border:none;border-radius:10px;padding:14px 16px;background:var(--red);color:#fff;
 cursor:pointer;letter-spacing:.08em;box-shadow:0 3px 0 #6d0715}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #6d0715}
.btn:disabled{background:#2b2b2f;color:#66636b;box-shadow:0 3px 0 #18181a}
.btn.ghost{background:#26262a;box-shadow:0 3px 0 #111}
#playBtn{width:100%;margin-top:8px;font-size:16px}
.hint{font-size:12px;color:var(--dim);text-align:center;margin-top:8px;min-height:18px}
.rulebtn{background:none;border:1px solid var(--line);color:var(--dim);border-radius:6px;font-size:11px;padding:3px 8px;font-family:inherit}
.log{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;height:140px;overflow-y:auto;font-size:12px;line-height:1.65}
.log div{border-bottom:1px dashed #222;padding:2px 0}
.log .gm{color:var(--red2);font-weight:700}.log .gm::before{content:"主催者 ▸ ";color:#7a1b27;font-weight:400}
.log .sys{color:var(--dim)}.log .bad{color:#ff8a98}.log .good{color:#8fe39c}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:60;opacity:0;pointer-events:none;transition:.2s;padding:18px}
.ov.show{opacity:1;pointer-events:auto}
.md{background:#111113;border:1px solid var(--red);border-radius:14px;padding:20px 18px;width:100%;max-width:410px;box-shadow:0 0 40px rgba(208,20,44,.35);max-height:88vh;overflow-y:auto}
.md h2{font-family:"Dela Gothic One";font-weight:400;margin:0 0 10px;font-size:21px;text-align:center;color:var(--red2)}
.md .bd{font-size:13.5px;line-height:1.75}
.md .bd p{margin:0 0 8px}.md .bd ul{margin:4px 0 8px;padding-left:18px}.md .bd li{margin-bottom:3px}
.md h3{font-size:13px;color:var(--gold);margin:12px 0 4px}
.md .bts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.md .bts .btn{flex:1 1 40%}
.flash{position:fixed;inset:0;background:var(--red);opacity:0;pointer-events:none;z-index:55}
.flash.go{animation:fl .5s ease-out}@keyframes fl{0%{opacity:.55}100%{opacity:0}}
.quake{animation:qk .35s}
@keyframes qk{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,4px)}}
.banner{position:fixed;left:0;right:0;top:38%;text-align:center;z-index:58;pointer-events:none;opacity:0;font-family:"Dela Gothic One";font-size:36px;letter-spacing:.08em;text-shadow:0 0 22px currentColor,0 3px 0 #000}
.banner.go{animation:bn 1.2s ease-out}
/* ===== my life gauge ===== */
.mylife{margin-top:12px;background:#0f0f11;border:1px solid #2e2e33;border-radius:10px;padding:8px 10px;position:relative}
.ml-h{display:flex;justify-content:space-between;align-items:baseline;font-family:"Dela Gothic One";font-size:13px;letter-spacing:.12em}
#mlN{font-size:18px;font-variant-numeric:tabular-nums}
.segs{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;margin-top:6px;height:20px}
.seg{border-radius:2px;background:var(--c);box-shadow:0 0 6px var(--c);transition:background .3s}
.seg.off{background:#18181b;box-shadow:inset 0 0 0 1px #26262a;
 background-image:linear-gradient(120deg,transparent 42%,#3a3a40 44%,transparent 47%),linear-gradient(60deg,transparent 60%,#2e2e33 62%,transparent 64%)}
.seg.breaking{animation:segb .4s}
@keyframes segb{0%{transform:scale(1.6,1.3);background:#fff;box-shadow:0 0 14px #fff}40%{transform:translateY(3px) rotate(8deg)}100%{transform:none}}
.mylife.shatter{animation:mls .6s}
@keyframes mls{0%{transform:translate(-8px,0) skewX(-12deg);border-color:#ff3b52;box-shadow:0 0 24px #ff3b52}
 20%{transform:translate(7px,2px) skewX(9deg);filter:hue-rotate(90deg)}40%{transform:translate(-5px,-2px);clip-path:inset(0 0 45% 0)}
 55%{transform:translate(4px,1px);clip-path:inset(40% 0 0 0)}70%{clip-path:inset(0);filter:none}100%{transform:none}}
.frag{position:fixed;z-index:59;pointer-events:none;animation:frag 1s cubic-bezier(.15,.6,.35,1) forwards}
@keyframes frag{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.crackline{position:absolute;left:0;right:0;top:50%;height:2px;background:#fff;pointer-events:none;opacity:0;box-shadow:0 0 10px #fff}
.mylife.shatter .crackline{animation:crk .45s}
@keyframes crk{0%{opacity:1;transform:scaleX(0) rotate(-3deg)}40%{opacity:1;transform:scaleX(1) rotate(2deg)}100%{opacity:0}}
/* ===== persistent scars ===== */
#scars{position:fixed;inset:0;pointer-events:none;z-index:56;overflow:hidden}
.scar{position:absolute;mix-blend-mode:difference;
 animation:scarJ var(--t) steps(3) var(--dl) infinite,scarC var(--ct) steps(1) var(--dl) infinite}
.scar.new{animation:scarIn .35s ease-out,scarJ var(--t) steps(3) .35s infinite,scarC var(--ct) steps(1) var(--dl) infinite}
@keyframes scarJ{0%,100%{transform:translateX(0)}30%{transform:translateX(var(--j))}33%{transform:translateX(calc(var(--j) * -1.5)) scaleY(1.8);opacity:.12}36%{transform:translateX(0)}70%{transform:translateX(calc(var(--j) * .5))}}
@keyframes scarC{0%{background:#ff0030}14%{background:#00e5ff}28%{background:#ffe600}42%{background:#ff00ff}57%{background:#00ff66}71%{background:#ffffff}85%{background:#3d5cff}}
@keyframes scarIn{0%{transform:scaleX(0);opacity:1;filter:brightness(3)}60%{transform:scaleX(1.1)}100%{transform:none}}
/* ===== damage fx ===== */
.tear{position:fixed;left:0;right:0;z-index:57;pointer-events:none;mix-blend-mode:difference}
.dmgf{position:fixed;z-index:59;pointer-events:none;font-family:"Dela Gothic One";font-size:34px;color:#ff3b52;white-space:nowrap;
 text-shadow:0 0 14px #ff3b52,3px 0 #0ff,-3px 0 #f00,0 3px 0 #000;animation:df 1.6s ease-out forwards}
.dmgf.me{font-size:46px}
@keyframes df{0%{opacity:0;transform:translate(-50%,10px) scale(2.4)}12%{opacity:1;transform:translate(-50%,0) scale(1)}20%{transform:translate(calc(-50% + 4px),0)}26%{transform:translate(calc(-50% - 4px),0)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-46px)}}
.seat.hit{animation:hit .55s}
@keyframes hit{0%{background:rgba(255,40,70,.6);transform:translate(-6px,0)}20%{transform:translate(6px,-2px)}40%{transform:translate(-4px,2px)}60%{transform:translate(3px,0)}100%{background:transparent;transform:none}}
.seat.target{box-shadow:0 0 0 2px #ff3b52,0 0 18px rgba(255,59,82,.6)}
.cap{position:fixed;left:50%;top:54%;transform:translateX(-50%);z-index:58;pointer-events:none;background:rgba(10,0,2,.9);border:1px solid #ff3b52;
 border-radius:10px;padding:10px 16px;text-align:center;min-width:240px;max-width:92vw;opacity:0;box-shadow:0 0 30px rgba(255,59,82,.45)}
.cap.go{animation:capA 1.5s ease-out forwards}
@keyframes capA{0%{opacity:0;transform:translate(-50%,8px)}10%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
.cap .who{font-size:20px;font-weight:900}.cap .amt{font-family:"Dela Gothic One";color:#ff3b52;font-size:26px;margin:0 4px}
.cap .why{font-size:11px;color:#b9a9ad;margin-top:3px}
.wrap.invert{filter:invert(1) hue-rotate(180deg) contrast(1.6)!important}
.wrap.quake2{animation:qk2 .7s !important}
@keyframes qk2{0%,100%{transform:none}10%{transform:translate(-16px,6px) rotate(-1.5deg)}20%{transform:translate(14px,-9px) rotate(1.2deg) skewX(4deg)}35%{transform:translate(-11px,-5px)}50%{transform:translate(9px,8px) rotate(-.8deg)}65%{transform:translate(-6px,3px)}80%{transform:translate(4px,-3px)}}
.flash.big{animation:flb .8s ease-out}
@keyframes flb{0%{opacity:.85}15%{opacity:.2}25%{opacity:.7}100%{opacity:0}}
/* ===== low-life corruption ===== */
#noise{position:fixed;inset:-50%;pointer-events:none;z-index:48;opacity:0;background-size:180px;animation:nz .22s steps(4) infinite;mix-blend-mode:screen;transition:opacity .8s}
@keyframes nz{0%{transform:translate(0,0)}25%{transform:translate(-7%,4%)}50%{transform:translate(5%,-6%)}75%{transform:translate(-3%,8%)}100%{transform:translate(6%,2%)}}
#vig{position:fixed;inset:0;pointer-events:none;z-index:47;opacity:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(170,0,20,.6) 100%);transition:opacity .8s}
#scan{position:fixed;left:0;right:0;height:60px;top:-80px;pointer-events:none;z-index:48;opacity:0;
 background:linear-gradient(transparent,rgba(255,255,255,.07),transparent);animation:scan 2.6s linear infinite}
@keyframes scan{0%{top:-80px}100%{top:110%}}
.wrap>*{transition:filter .8s}
:root{--k:0}
#noise{opacity:calc(var(--k)*.17)}
#vig{opacity:calc(var(--k)*1.1)}
#scan{opacity:calc(var(--k)*1.4 - .2)}
.wrap{text-shadow:calc(var(--k)*3.5px) 0 rgba(255,0,40,.6),calc(var(--k)*-3.5px) 0 rgba(0,220,255,.55)}
header,.info,.event,.log{filter:blur(calc(var(--k)*var(--k)*2.6px)) contrast(calc(1 + var(--k)*.35))}
.table{filter:blur(calc(var(--k)*var(--k)*1.8px)) contrast(calc(1 + var(--k)*.3)) saturate(calc(1 + var(--k)*.6))}
.hand{filter:blur(calc(var(--k)*var(--k)*.7px))}
.md{text-shadow:calc(var(--k)*2px) 0 rgba(255,0,40,.5),calc(var(--k)*-2px) 0 rgba(0,220,255,.5)}
.hp1 #vig{animation:beat 1.2s infinite}
@keyframes beat{0%,100%{opacity:.5}8%{opacity:1}16%{opacity:.65}26%{opacity:.95}}
.hp1 .wrap{animation:drift 3s ease-in-out infinite}
@keyframes drift{0%,100%{transform:none}50%{transform:translate(1px,-1px) rotate(.35deg)}}
.hp0 #noise{opacity:.08}
.hp0 .wrap>*{filter:grayscale(1) blur(.6px) brightness(.85)}
.wrap.quake{animation:qk .35s !important}
.glitch{animation:gl .18s steps(2) !important}
@keyframes gl{0%{transform:translate(-9px,2px) skewX(10deg);clip-path:inset(12% 0 38% 0)}50%{transform:translate(7px,-3px) skewX(-7deg);clip-path:inset(48% 0 6% 0)}100%{transform:translate(-3px,1px);clip-path:inset(0)}}
@keyframes bn{0%{opacity:0;transform:scale(1.6)}15%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
 <header><h1>最下位<span>の札</span></h1><div class="sub">DEATH CARD GAME</div></header>
 <div class="info"><span>ROUND <b id="rnd">1</b>　TRICK <b id="trk">1</b>/4</span><button class="rulebtn" id="ruleBtn">ルール</button></div>
 <div class="event calm" id="event"><span class="en">―</span><span class="ed"></span></div>
 <div class="table" id="table"></div>
 <div class="mylife" id="mylife"><div class="crackline"></div><div class="ml-h"><span>YOUR LIFE</span><span id="mlN">20/20</span></div><div class="segs" id="segs"></div></div>
 <div class="hand-t"><span>あなたの手札</span><span id="handInfo"></span></div>
 <div class="hand locked" id="hand"></div>
 <button class="btn" id="playBtn" disabled>カードを選べ</button>
 <div class="hint" id="hint"></div>
 <div class="log" id="log"></div>
</div>
<div id="scars"></div><div id="vig"></div><div id="noise"></div><div id="scan"></div>
<div class="flash" id="flash"></div>
<div class="banner" id="banner"></div>
<div class="cap" id="cap"></div>
<div class="ov" id="ov"><div class="md"><h2 id="mT"></h2><div class="bd" id="mB"></div><div class="bts" id="mBt"></div></div></div>
<script>
const $=id=>document.getElementById(id);
const MAXHP=20,TRICKS=4,REAPER=4,GREED=3,VAMP=3,BOMB=2;
const SP={reaper:{i:'☠',n:'死神'},charm:{i:'✚',n:'護符'},rev:{i:'⇅',n:'反転'},
 vamp:{i:'❦',n:'吸血'},mimic:{i:'◐',n:'偽札'},bomb:{i:'✸',n:'爆弾'},seal:{i:'⊘',n:'封印'},scale:{i:'⚖\uFE0E',n:'天秤'}};
const EVENTS=[
 {k:'calm',n:'平穏',d:'特別なルールはない。',w:2},
 {k:'blood',n:'血の宴',d:'このラウンドのダメージはすべて2倍。',w:2},
 {k:'night',n:'逆転の夜',d:'最初から反転状態。最も大きい数字を出した者が罰を受ける。',w:2},
 {k:'silence',n:'沈黙',d:'特殊札は効果を失い「0」として扱う。',w:2},
 {k:'greed',n:'強欲',d:'最も大きい数字を出した者は命を3回復する（最大20）。',w:2},
 {k:'gallows',n:'処刑台',d:'最下位が受けるダメージ +3。',w:2},
 {k:'twin',n:'二人目の生贄',d:'2番目に悪い数字の者も、3番目との差だけ罰を受ける。',w:2},
 {k:'famine',n:'飢餓',d:'公開のたびに全員の命が1減る。',w:1},
 {k:'mirror',n:'鏡の間',d:'死神と吸血は必ず使った本人に跳ね返る。',w:2},
 {k:'madness',n:'狂気',d:'公開された数字が −2〜+2 の範囲でランダムに狂う。',w:2},
];
let P=[],round=0,trick=0,over=false,ev=EVENTS[0],speed=1,actx=null,sel=-1;

const sleep=ms=>new Promise(r=>setTimeout(r,ms*speed));
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
function tone(f,d=.08,type='square',v=.05){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
 const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,actx.currentTime);
 g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}
function log(m,c=''){const d=document.createElement('div');d.className=c;d.innerHTML=m;$('log').prepend(d);while($('log').children.length>70)$('log').lastChild.remove();}
const gm=m=>log(m,'gm');
const nm=p=>`<span style="color:${p.color};font-weight:900">${p.name}</span>`;
const alive=()=>P.filter(p=>p.alive);
function banner(t,c='#ff3b52'){const b=$('banner');b.textContent=t;b.style.fontSize=t.length>9?'24px':t.length>6?'30px':'36px';b.style.color=c;b.classList.remove('go');void b.offsetWidth;b.classList.add('go');}
function addScars(n){const box=$('scars');
 for(let i=0;i<n;i++){const e=document.createElement('div');e.className='scar new';const t=Math.random();let w,h,op;
  if(t<.3){w=100;h=1+rnd(3);op=.35+Math.random()*.4;}                 // thin full-width line
  else if(t<.6){w=25+rnd(76);h=4+rnd(14);op=.25+Math.random()*.35;}    // band
  else if(t<.82){w=5+rnd(30);h=18+rnd(55);op=.15+Math.random()*.25;}   // big block
  else{w=1+rnd(6);h=3+rnd(8);op=.5+Math.random()*.4;}                  // pixel chip
  e.style.cssText=`top:${rnd(100)}%;left:${rnd(101-w)}%;width:${w}%;height:${h}px;opacity:${op.toFixed(2)};`+

/* ===== corruption by remaining life ===== */
let hpLv=3;const orig=new WeakMap();const GCH=[...'▓▒░█#@%&?!¥$01ｦｱｳｴｵﾀﾁﾂ※〓'];
(function(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');const d=x.createImageData(128,128);
 for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}
 x.putImageData(d,0,0);$('noise').style.backgroundImage=`url(${c.toDataURL()})`;})();
let lastHp=MAXHP,K=0;
function applyHP(){const me=P[0];if(!me)return;const hp=me.alive?me.hp:0;
 K=me.alive?Math.max(0,Math.min(1,1-(hp-1)/(MAXHP-1))):.25;   // 0 at full, 1 at 1hp
 document.body.style.setProperty('--k',K.toFixed(3));
 const lv=!me.alive?0:hp>=15?3:hp>=8?2:1;
 if(lv!==hpLv){hpLv=lv;document.body.className='hp'+lv;}
 if(hp<lastHp)burst(Math.min(1,(lastHp-hp)/8));lastHp=hp;}
function glitchOnce(){const els=[...document.querySelectorAll('header,.info,.event,.table,.hand,.log')];const e=pick(els);
 e.classList.remove('glitch');void e.offsetWidth;e.classList.add('glitch');setTimeout(()=>e.classList.remove('glitch'),200);}
function scramble(n){const w=document.createTreeWalker($('wrap'),NodeFilter.SHOW_TEXT,{acceptNode:t=>t.nodeValue.trim()?1:2});
 const ns=[];while(w.nextNode())ns.push(w.currentNode);
 for(let k=0;k<n&&ns.length;k++){const t=ns.splice(rnd(ns.length),1)[0];const o=orig.has(t)?orig.get(t):t.nodeValue;orig.set(t,o);
  t.nodeValue=[...o].map(c=>c.trim()&&Math.random()<.6?pick(GCH):c).join('');
  setTimeout(()=>{t.nodeValue=o;orig.delete(t);},120+rnd(280));}}
function burst(f=1){for(let i=0;i<3+Math.round(f*6);i++)setTimeout(()=>{glitchOnce();scramble(5);},i*80);
 for(let i=0;i<5;i++)setTimeout(()=>tone(60+rnd(900),.04,'square',.04),i*70);}
(function gloop(){let next=900;
 if(P[0]&&P[0].alive&&K>.2){const k=K;
  if(Math.random()<k)glitchOnce();if(k>.6&&Math.random()<k-.3)setTimeout(glitchOnce,90);
  if(Math.random()<k*k)scramble(1+Math.floor(k*k*5));
  if(k>.75&&Math.random()<.3)tone(40+rnd(80),.06,'sawtooth',.03);
  next=400+(1-k)*3200+rnd(900);}
 else if(hpLv===0){if(Math.random()<.4)glitchOnce();next=2500+rnd(3000);}
 setTimeout(gloop,next);})();

/* CPU */
const TARGETED=['reaper','vamp','scale'];
// weighted random: weaker players more likely, everyone (incl. you) has the same base chance
function reaperTarget(p,others){const ws=others.map(o=>{let w=6+(MAXHP-o.hp)*.6;if(o.hp<=REAPER)w+=8;return w*(.6+Math.random()*.8);});
 let r=Math.random()*ws.reduce((a,b)=>a+b,0);for(let i=0;i<others.length;i++){if((r-=ws[i])<0)return others[i];}return others[others.length-1];}
function richest(others){const m=Math.max(...others.map(o=>o.hp));return pick(others.filter(o=>o.hp===m));}
function cpuChoose(p){const h=p.hand;const nums=h.map((c,i)=>[c,i]).filter(([c])=>c.t==='num').sort((a,b)=>a[0].v-b[0].v);
 const idx=t=>h.findIndex(c=>c.t===t);
 const others=alive().filter(x=>x!==p);
 const rev=ev.k==='night';const sil=ev.k==='silence';const mirror=ev.k==='mirror';
 if(!sil){
  if(p.hp<=6&&idx('charm')>=0&&Math.random()<.75)return{i:idx('charm')};
  if(idx('scale')>=0){const top=richest(others);if(top.hp-p.hp>=6&&Math.random()<.8)return{i:idx('scale'),tgt:top};}
  if(!mirror&&idx('vamp')>=0&&Math.random()<(p.hp<=12?.6:.3))return{i:idx('vamp'),tgt:reaperTarget(p,others)};
  if(!mirror&&idx('reaper')>=0&&Math.random()<.55)return{i:idx('reaper'),tgt:reaperTarget(p,others)};
  if(idx('bomb')>=0&&Math.random()<.4)return{i:idx('bomb')};
  if(idx('mimic')>=0&&!rev&&Math.random()<.45)return{i:idx('mimic')};
  if(idx('seal')>=0&&Math.random()<.2)return{i:idx('seal')};
  if(idx('rev')>=0&&nums.length&&Math.random()<.35)return{i:idx('rev')};
 }
 if(nums.length){
  if(rev)return{i:nums[0][1]};
  const left=TRICKS-trick;
  if(p.hp<=6||nums.length===1||left<=1)return{i:nums[nums.length-1][1]};
  const k=Math.min(nums.length-1,Math.floor(nums.length/2)+rnd(Math.ceil(nums.length/2)));
  return{i:nums[k][1]};}
 const i=rnd(h.length);const t=h[i].t;
 return{i,tgt:TARGETED.includes(t)?(t==='scale'?richest(others):reaperTarget(p,others)):null};}

const who=p=>p===P[0]?'あなた':p.name;
async function playTrick(){
 P.forEach(p=>{p.played=null;p.tgt=null;p.lose=false;p.res='';p.resCls='';p.val=null;});renderTable(false);

 pl.forEach(p=>log(`${nm(p)} → ${cname(p.played)}${TARGETED.includes(p.played.t)&&p.tgt&&!sil?`（標的：${nm(p.tgt)}）`:''}`,'sys'));
 // seal

  if(ch.length){banner('狂気','#ff7ad9');ch.forEach(p=>{log(`${nm(p)} の「${p.played.v}」は狂って <b>${p.val}</b> になった。`,'sys');p.res=`${p.played.v}→${p.val}`;p.resCls='';});renderTable(true);await sleep(1300);}}
 const mims=pl.filter(p=>act(p,'mimic'));

 // reverse
 let reverse=ev.k==='night';
 const revs=pl.filter(p=>act(p,'rev')).length;
 if(revs%2===1)reverse=!reverse;
 if(revs){banner(revs%2?'反転':'反転×相殺','#7fb7ff');gm(revs%2?'反転だ。今回は大きい数字が罰を受ける。':'反転同士が打ち消し合った。');await sleep(1100);}

 const cmp=pl.filter(p=>p.val!==null);
 if(cmp.length>=2){const vals=cmp.map(p=>p.val);const uniq=[...new Set(vals)].sort((a,b)=>a-b);
  if(reverse)uniq.reverse();   // uniq[0] = worst

   gm(`${tag}は${tv}（${losers.map(l=>l.name).join('・')}）、次点は${nv}。差は${Math.abs(nv-tv)}${ev.k==='gallows'?'、処刑台で+3':''}だ。`);await sleep(900);
   for(const l of losers)await damage(l,diff,`${reverse?'最大':'最小'}の数字（${tv}）と次点（${nv}）の差${ev.k==='gallows'?'＋処刑台':''}`);
   if(ev.k==='twin'&&uniq.length>=3){const v2=uniq[1],v3=uniq[2],d2=Math.abs(v3-v2);const sec=cmp.filter(p=>p.val===v2&&p.hp>0);

  else if(k==='scale'){

    for(const x of [p,t]){if(x.hp>avg)await damage(x,x.hp-avg,'天秤で平均化',true);else if(x.hp<avg)await heal(x,avg-x.hp,'天秤で平均化');}
    renderTable(true);await sleep(600);}}
  renderTable(true);await sleep(500);}
 // bombs
 for(const p of pl.filter(p=>act(p,'bomb'))){banner('爆弾','#ff9a3c');gm(`${p.name}の爆弾が炸裂した！`);tone(50,.6,'sawtooth',.15);await sleep(900);
  for(const o of pl){if(o===p||o.hp<=0)continue;
   if(act(o,'charm')){log(`${nm(o)} は護符で爆風を防いだ。`,'good');continue;}
   await damage(o,BOMB,`${p.name}の爆弾`);}}
 // famine
 if(ev.k==='famine'){banner('飢餓','#a0a0a0');gm('腹が減ったな。全員、命を1ずつ削れ。');await sleep(800);
  for(const p of pl){if(p.hp<=0)continue;const prev=p.hp;p.hp--;p.res=(p.res?p.res+' ':'')+'-1';p.resCls='bad';log(`${nm(p)} 飢餓で -1（残り ${p.hp}）`,'bad');
   if(p===P[0]){breakGauge(prev,p.hp);addScars(1);}}
  const f=$('flash');f.className='flash';void f.offsetWidth;f.classList.add('go');tone(90,.3,'sawtooth',.08);renderTable(true);await sleep(1000);}
 // charm safe marks
 pl.filter(p=>act(p,'charm')&&!p.res).forEach(p=>{p.res='安全';p.resCls='good';});
 // eliminations
 for(const p of pl)if(p.hp<=0&&p.alive){p.alive=false;banner(p.name+' 脱落');gm(pick([`${p.name}、ここで終わりだ。`,`さようなら、${p.name}。`,`${p.name}は退場した。`]));tone(110,.8,'sawtooth',.12);renderTable(true);await sleep(1200);
  if(p===P[0]){speed=.5;await modal('脱落','<p>あなたの命は尽きた。</p><p>残りの勝負を見届けろ。</p>',[{label:'観戦する',value:1}]);}}
 renderTable(true);await sleep(1300);}

function checkEnd(){const a=alive();if(a.length<=1){finish(a[0]||null);return true;}return false;}
async function finish(w){over=true;renderTable(true);$('playBtn').disabled=true;await sleep(400);let t,h;
 if(w===P[0]){t='生還';banner('SURVIVED','#ffe27a');h=`<p>最後に立っていたのは、あなただ。</p><p style="color:var(--dim)">主催者「…見事だ。賞金は約束通りに。」</p><p>ROUND ${round}　残り命 ${w.hp}/${MAXHP}</p>`;}
 else if(w){t='GAME OVER';banner('GAME OVER');h=`<p>${nm(w)} が最後の一人となった。</p>`;}
 else{t='全滅';banner('全滅');h='<p>最後の公開で、全員の命が尽きた。</p><p style="color:var(--dim)">主催者「勝者なし、か。」</p>';}
 await sleep(1100);if(await modal(t,h,[{label:'もう一度',value:1}]))start();}

function pickEvent(){const tot=EVENTS.reduce((s,e)=>s+e.w,0);let r=Math.random()*tot;for(const e of EVENTS){if((r-=e.w)<0)return e;}return EVENTS[0];}
const RULES=`
 <p>参加者は4人。生き残れるのは<b style="color:var(--red2)">一人だけ</b>。命は全員 <b style="color:#5fd07a">20</b>。</p>
 <h3>流れ</h3>
 <ul><li>毎ラウンド、全員に4枚配られる。</li>
 <li>1枚ずつ伏せて出し、全員そろったら一斉に公開（これを4回）。</li>
 <li><b>最も小さい数字</b>を出した者は、<b>2番目に小さい数字との差</b>だけ命が減る（例：2と9なら -7）。同点の最下位は全員が受ける。</li>
 <li>毎ラウンド、主催者が<b>特別ルール</b>を1つ発動する。</li></ul>
 <h3>カード（数字1〜13・各4枚＋特殊札）</h3>
 <ul><li><b style="color:#ff4d5e">☠ 死神</b>：標的を1人選び命 -${REAPER}。</li>
 <li><b style="color:#79e08a">✚ 護符</b>：自分は安全。死神を跳ね返し、吸血・天秤・爆弾を防ぐ。</li>
 <li><b style="color:#7fb7ff">⇅ 反転</b>：今回は<b>最も大きい数字</b>が、2番目に大きい数字との差だけ罰を受ける。2枚出たら打ち消し合う。</li>
 <li><b style="color:#d04aff">❦ 吸血</b>：標的の命を${VAMP}奪い、自分のものにする。</li>
 <li><b style="color:#e6c46a">◐ 偽札</b>：その回に出た<b>最も大きい数字</b>に化けて勝負に参加する（反転時は危険）。</li>
 <li><b style="color:#ff9a3c">✸ 爆弾</b>：自分以外の全員の命 -${BOMB}。</li>
 <li><b style="color:#c8c8c8">⊘ 封印</b>：他の特殊札をすべて無効にし「0」にする。</li>
 <li><b style="color:#5fd8d0">⚖ 天秤</b>：相手1人と命を足して半分ずつにする（端数切り捨て）。</li>
 <li>偽札以外の特殊札を出した者は数字の勝負に参加しない。</li></ul>
 <h3>特別ルール</h3>
 <ul>${EVENTS.map(e=>`<li><b>${e.n}</b>：${e.d}</li>`).join('')}</ul>
 <p style="color:var(--dim);font-size:12px">強い札を温存するか、今使うか。最後の1枚まで気を抜くな。</p>`;
$('ruleBtn').onclick=()=>{if(!$('ov').classList.contains('show'))modal('ルール',RULES,[{label:'閉じる',value:1}]);};

async function loop(){
 while(!over){round++;trick=0;ev=pickEvent();const d=deck();alive().forEach(p=>p.hand=d.splice(0,TRICKS));
  P.filter(p=>!p.alive).forEach(p=>p.hand=[]);
  renderEvent();renderHand();renderTable(false);
  banner(`ROUND ${round}`,'#e9e6e1');await sleep(1200);
  if(ev.k!=='calm'){banner(ev.n);gm(`今回の特別ルールは「${ev.n}」。${ev.d}`);await sleep(1300);}else gm('今回は特別ルールなしだ。');
  for(trick=0;trick<TRICKS;trick++){renderTable(false);await playTrick();if(checkEnd())return;}
 }}
async function start(){
 P=[{name:'あなた',color:'#f2f2f2',cpu:false},{name:'No.02',color:'#ff4d5e',cpu:true},{name:'No.07',color:'#3fb2ff',cpu:true},{name:'No.13',color:'#ffc93c',cpu:true}]
  .map(p=>({...p,hp:MAXHP,alive:true,hand:[],played:null}));
 round=0;trick=0;over=false;speed=1;lastHp=MAXHP;$('scars').innerHTML='';document.querySelectorAll('.tear,.frag,.dmgf').forEach(e=>e.remove());ev=EVENTS[0];$('log').innerHTML='';renderEvent();renderTable(false);renderHand();
 await modal('最下位の札',RULES,[{label:'ゲームを始める',value:1}]);
 gm('では、始めよう。最下位になった者から死んでいく。');loop();}
start();
</script>
</body>
